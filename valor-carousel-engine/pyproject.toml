[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valor-carousel-engine"
version = "0.1.0"
description = "Automated TikTok photo-carousel generator for Valor Promotions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Valor Promotions" }]
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.60.0",
    "Pillow>=10.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "respx>=0.21",
]

[project.scripts]
valor-carousel = "src.main:cli"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
